name: Maintain governance publication
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: governance-maintenance
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Prepare timestamps and notify only on publication-state changes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/governance_maintenance.py --repository "$GITHUB_REPOSITORY"
