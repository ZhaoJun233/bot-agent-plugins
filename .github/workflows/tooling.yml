name: Marketplace native tooling checks
on:
  push:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      candidate_repository:
        type: string
        required: true
permissions:
  contents: read
jobs:
  native-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_sha || github.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            10.0.101
            8.0.x
      # Complete authenticated checkouts before any candidate-controlled code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ZhaoJun233/bot-agent
          ref: c37c818a16a1b489c3a4d5f2c6d7a9dce42776e7
          path: candidate/artifacts/host-reference
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ZhaoJun233/bot-agent
          ref: afbda550d44df6191e173561808eb280f83e6f46
          path: candidate/artifacts/host-current
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - run: dotnet build examples/HelloPlugin/HelloPlugin.csproj -c Release
      - run: dotnet build examples/HelloPlugin-1.0.1/HelloPlugin.csproj -c Release
      - run: dotnet build templates/PluginTemplate/PluginTemplate.csproj -c Release -p:BotAgentCorePath="$GITHUB_WORKSPACE/candidate/sdk/BotAgent.PluginApi/bin/Release/net8.0/BotAgent.Core.dll"
      - run: python tools/package.py --input examples/HelloPlugin/bin/Release/net8.0 --manifest submissions/community.example.hello/1.0.0.json --output artifacts/release --check-catalog
      - name: Prepare the new version packaging input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('submissions/community.example.hello/1.0.0.json').read_text(encoding='utf-8'))['manifest']
          manifest.update(json.loads(Path('examples/HelloPlugin-1.0.1/plugin.json').read_text(encoding='utf-8')))
          pin = manifest['Id'] + '-' + manifest['Version']
          manifest['DownloadUrl'] = 'https://github.com/ZhaoJun233/bot-agent-plugins/releases/download/' + pin + '/' + pin + '.zip'
          Path('artifacts/hello-1.0.1-input.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY
      - run: python tools/package.py --input examples/HelloPlugin-1.0.1/bin/Release/net8.0 --manifest artifacts/hello-1.0.1-input.json --output artifacts/hello-1.0.1-release
      - name: Package two real Python example candidates with the canonical host SDK
        run: |
          python - <<'PY'
          import copy, hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from package import package
          sdk = Path('artifacts/host-current/src/BotAgent.Mcp/PythonWorkerSdk/botagent_worker.py')
          if hashlib.sha256(sdk.read_bytes()).hexdigest() != '6459860e926101a14171771d2ea4f8695b2f19d923088ad56ebbd28242719560':
              raise SystemExit('Canonical current-host SDK differs from the fixed source reference')
          template = json.loads(Path('templates/PythonWorker/submission.template.json').read_text(encoding='utf-8'))['manifest']
          for version in ('1.0.0', '1.0.1'):
              manifest = copy.deepcopy(template)
              manifest['Version'] = version
              manifest['MinimumHostVersion'] = '1.4.0'
              pin = manifest['Id'] + '-' + version
              manifest['DownloadUrl'] = 'https://github.com/ZhaoJun233/bot-agent-plugins/releases/download/' + pin + '/' + pin + '.zip'
              package(Path('examples/PythonEcho-' + version), Path('artifacts/python-echo-' + version + '-release'), manifest, sdk=sdk)
          PY
      - name: Real Python version, configuration and lifecycle protocol
        run: python tests/PythonExampleProbe/probe.py --sdk artifacts/host-current/src/BotAgent.Mcp/PythonWorkerSdk/botagent_worker.py artifacts/python-echo-1.0.0-release artifacts/python-echo-1.0.1-release
      - name: Docker Python 3.11 protocol acceptance on Linux
        run: |
          docker pull python:3.11-slim-bookworm
          docker image inspect python:3.11-slim-bookworm --format '{{.Id}} {{json .RepoDigests}}'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,source=$PWD,target=/candidate,readonly" --workdir /candidate \
            python:3.11-slim-bookworm python -B tests/PythonExampleProbe/probe.py \
            --sdk artifacts/host-current/src/BotAgent.Mcp/PythonWorkerSdk/botagent_worker.py \
            artifacts/python-echo-1.0.0-release artifacts/python-echo-1.0.1-release
      - run: python tools/generate_catalog.py --check
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: dotnet build artifacts/host-reference/src/BotAgent.Core/BotAgent.Core.csproj -c Release
      - run: dotnet run --project tests/ContractProbe -c Release -- artifacts/host-reference/src/BotAgent.Core/bin/Release/net8.0/BotAgent.Core.dll examples/HelloPlugin/bin/Release/net8.0/HelloPlugin.dll
      - name: New version against actual net8 Core
        run: dotnet run --project tests/ContractProbe -c Release -- artifacts/host-reference/src/BotAgent.Core/bin/Release/net8.0/BotAgent.Core.dll examples/HelloPlugin-1.0.1/bin/Release/net8.0/HelloPlugin.dll Marketplace.Examples.HelloPlugin community.example.hello 1.0.1
      - run: dotnet build artifacts/host-current/src/BotAgent.Core/BotAgent.Core.csproj -c Release
      - name: Build current-runtime contract probe
        run: dotnet build tests/ContractProbe -c Release -p:ProbeTargetFramework=net10.0
      - name: Current runtime probe against actual current Core
        run: dotnet tests/ContractProbe/bin/Release/net10.0/ContractProbe.dll artifacts/host-current/src/BotAgent.Core/bin/Release/net10.0/BotAgent.Core.dll examples/HelloPlugin/bin/Release/net8.0/HelloPlugin.dll
      - name: New version against actual net10 Core
        run: dotnet tests/ContractProbe/bin/Release/net10.0/ContractProbe.dll artifacts/host-current/src/BotAgent.Core/bin/Release/net10.0/BotAgent.Core.dll examples/HelloPlugin-1.0.1/bin/Release/net8.0/HelloPlugin.dll Marketplace.Examples.HelloPlugin community.example.hello 1.0.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-example-release
          path: candidate/artifacts/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-hello-1.0.1-candidate
          path: candidate/artifacts/hello-1.0.1-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-python-echo-candidates
          path: |
            candidate/artifacts/python-echo-1.0.0-release/
            candidate/artifacts/python-echo-1.0.1-release/
          if-no-files-found: error
