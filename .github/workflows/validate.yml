name: Validate marketplace
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  data-and-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trusted
    outputs:
      lane: ${{ steps.route.outputs.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - id: route
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ''
        run: python tools/marketplace_gate.py validate --base . --candidate ../candidate
  tooling:
    needs: data-and-routing
    if: needs.data-and-routing.outputs.lane == 'tooling'
    permissions:
      contents: read
    uses: ./.github/workflows/tooling.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name }}
